<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0c2d47" />
  <title>CAT Studio | Evidence-Based Policy Research</title>
  <meta name="description" content="A guided CAT 1/2/3 drafting and evidence appraisal workspace compatible with the 2026 SNU CAT form." />
  <style>
:root{
  --navy:#10334d;--deep:#0b263d;--teal:#0d7c75;--aqua:#d9f6f1;--tealLine:#9bded3;--ink:#1a2938;--muted:#5e6e7b;--line:#e2e8ee;--bg:#f4f7fa;--white:#fff;--gold:#ae7628;--goldbg:#fff5df;--danger:#ac353d;--radius:14px;--shadow:0 10px 25px rgba(13,38,61,.055);
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-synthesis:none
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
a{color:var(--teal);text-decoration:none}
a:hover{text-decoration:underline}
.shell{min-height:100vh;display:grid;grid-template-columns:253px 1fr}
.sidebar{background:var(--deep);color:#e9f4f8;min-height:100vh;position:sticky;top:0;max-height:100vh;padding:28px 18px;display:flex;flex-direction:column}
.brand{display:flex;gap:10px;align-items:center;padding:4px 9px 30px}
.brand-logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#20b7aa,#087d82);color:white;display:grid;place-items:center;font-size:20px;font-weight:900;letter-spacing:-2px}
.brand-main{font-size:18px;letter-spacing:-.7px;font-weight:800}
.brand-sub{font-size:10px;color:#98b7c7;letter-spacing:1.2px;text-transform:uppercase}
.nav-label{text-transform:uppercase;color:#92aabc;font-size:10px;letter-spacing:1.3px;font-weight:800;padding:0 13px;margin-bottom:10px}
.nav-item{border:0;background:transparent;color:#bed0dc;border-radius:10px;display:flex;align-items:center;text-align:left;gap:11px;padding:12px 11px;width:100%;margin:2px 0;font-weight:580;font-size:13px}
.nav-item:hover{background:#173b55;color:#fff}
.nav-item.active{background:#1b4b62;color:white;box-shadow:inset 3px 0 #2de0c7}
.nav-icon{font-size:14px;color:#82adbf;width:23px;text-align:center}
.nav-item.active .nav-icon{color:#4be3cf}
.sidebar-bottom{margin-top:auto;background:#133a53;border:1px solid #204960;border-radius:12px;padding:14px 15px;font-size:12px;color:#bad0db}
.sidebar-bottom strong{display:block;color:white;font-size:13px;margin-bottom:4px}
.small-progress{height:6px;background:#29546b;border-radius:99px;margin-top:11px;overflow:hidden}
.small-progress span{display:block;height:100%;background:#35c7b7;transition:width .3s}
.main{min-width:0}
.topbar{background:white;min-height:76px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:14px 38px;gap:15px}
.crumb{color:#718291;font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.5px}
.topbar-title{font-size:16px;font-weight:750;margin-top:3px;letter-spacing:-.35px}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.round-pill{color:#0c665d;background:#e6f8f4;font-size:11px;font-weight:800;border-radius:100px;padding:7px 13px;border:1px solid #b9e7db}
.btn{border:1px solid #d3dfe7;background:white;color:#24445a;font-size:12px;padding:10px 14px;border-radius:9px;font-weight:750;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{border-color:#8dbaaf;background:#f8fffd;text-decoration:none}
.btn.primary{background:var(--teal);border-color:var(--teal);color:white}
.btn.primary:hover{background:#075f59}
.btn.dark{background:var(--deep);border-color:var(--deep);color:white}
.btn.pale{background:#e8f5f2;color:#116c66;border-color:#c5e9e2}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--danger);border-color:#efcad0}
.btn.sm{padding:6px 10px;font-size:11px}
.content{max-width:1250px;padding:33px 40px 70px;margin:auto}
.page-head{margin-bottom:23px;display:flex;justify-content:space-between;align-items:end;gap:18px}
.kicker{color:var(--teal);font-weight:800;text-transform:uppercase;letter-spacing:1.4px;font-size:10.5px}
h1{font-size:30px;line-height:1.2;letter-spacing:-1.2px;margin:5px 0 9px;font-weight:800;color:#142c3d}
h2{font-size:17px;line-height:1.3;letter-spacing:-.4px;margin:0 0 6px;color:#183249}
h3{font-size:14px;margin:0 0 8px;color:#234054}
p{margin:6px 0 12px}
.lead{color:var(--muted);font-size:14px;margin:0;max-width:780px}
.hero{border:1px solid #c8e4df;background:linear-gradient(115deg,#f5fffc,#e7f6f5);border-radius:16px;padding:26px 29px;display:flex;gap:20px;justify-content:space-between;align-items:center;margin:20px 0 24px}
.hero .icon-round{width:57px;height:57px;border-radius:17px;background:#d0eee7;display:grid;place-items:center;font-size:27px;flex:none}
.hero p{color:#476a6c;font-size:13px;max-width:650px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:white;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--radius);padding:22px;margin-bottom:16px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:start;gap:15px;margin-bottom:15px}
.card-sub{color:var(--muted);font-size:12.5px;margin:3px 0 0}
.stat{background:white;border:1px solid var(--line);border-radius:13px;padding:19px 20px;min-width:0}
.stat .num{font-size:30px;font-weight:800;letter-spacing:-1px;color:#123b53}
.stat .lbl{font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:#6c8190;font-weight:760}
.stat .detail{font-size:11px;color:#82939e}
.banner{background:var(--goldbg);color:#6d4c19;border:1px solid #f0daaa;border-radius:12px;padding:13px 16px;margin-bottom:21px;display:flex;align-items:start;gap:11px;font-size:12.5px}
.banner strong{color:#68410a}
.banner.good{background:#eaf8f3;border-color:#cae9de;color:#326858}
.section-note{font-size:12px;padding:11px 13px;border-radius:9px;background:#f0f6f9;color:#446273;border:1px solid #dfecf3;margin:12px 0}
.label{font-size:12px;color:#324b5a;font-weight:770;display:block;margin-bottom:6px}
.field{margin:0 0 17px;min-width:0}
.field:last-child{margin-bottom:0}
.field-hint{color:#7d8b96;font-size:11px;margin:4px 0 0}
.input,textarea,select{border:1px solid #cfdde5;border-radius:9px;background:white;color:#21394b;padding:11px 13px;width:100%;outline:none;font-size:13px;line-height:1.55}
textarea{resize:vertical;min-height:76px}
textarea.code{font:12px/1.6 ui-monospace,Consolas,Monaco,monospace;color:#253d51;background:#f9fbfd;min-height:104px}
.input:focus,textarea:focus,select:focus{border-color:#0e8d81;box-shadow:0 0 0 3px #d9f2ec}
textarea.bullets{min-height:95px}
.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hline{height:1px;background:var(--line);margin:20px 0}
.tag{font-size:10px;border-radius:99px;background:#eff3f6;color:#5b7080;padding:4px 9px;font-weight:750;display:inline-block}
.tag.ok{background:#e4f7ed;color:#287657}
.tag.pending{background:#fff4df;color:#8d641b}
.tag.info{background:#e9f1fb;color:#386b97}
.table-wrap{width:100%;overflow:auto;border:1px solid var(--line);border-radius:11px}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:550px}
th{background:#f6f8fa;color:#5a6b79;font-size:10.5px;text-transform:uppercase;letter-spacing:.55px;font-weight:800;text-align:left;padding:12px 13px;border-bottom:1px solid #e1e8ed}
td{padding:13px;border-bottom:1px solid #edf1f4;vertical-align:top;color:#2d4252}
tr:last-child td{border-bottom:0}
td .input,td textarea,td select{font-size:12px;padding:7px 9px}
td textarea{min-height:58px}
.step{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step-num{width:31px;height:31px;border-radius:9px;background:#e4f3f1;display:grid;place-items:center;color:var(--teal);font-weight:800}
.muted{color:var(--muted)}
.mini{font-size:11px;color:#81909b}
.empty{border:1px dashed #bfd3df;background:#f8fbfd;border-radius:12px;padding:25px;text-align:center;color:#536d80}
.empty .big{font-size:34px;display:block;margin-bottom:9px}
.search-card{background:#f7fbfc;border:1px solid #deebef;border-radius:11px;padding:14px 16px;margin-bottom:10px}
.search-card code{font:12px/1.5 ui-monospace,Consolas,Monaco,monospace;overflow-wrap:anywhere;display:block;margin:10px 0;color:#385064}
.paper{border:1px solid var(--line);padding:15px;border-radius:11px;margin-bottom:9px}
.paper-title{font-size:13px;font-weight:780;color:#213d53;line-height:1.5}
.paper-brief{font-size:11.5px;color:var(--muted);margin-top:4px}
.paper p{font-size:12px;color:#667582}
.paper.selected{border-color:var(--tealLine);background:#f7fffc}
.notice{background:#f8fafb;color:#537082;padding:14px 16px;border:1px solid #e2e9ec;border-radius:11px;font-size:12px}
.flow{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:13px 0}
.flow-node{min-width:165px;max-width:230px;flex:1;background:#f0f7fa;border:1px solid #c9e1e7;text-align:center;border-radius:12px;padding:16px;font-size:12px;font-weight:700;color:#255066}
.flow-arrow{font-size:22px;color:#789dad}
footer{font-size:11px;color:#95a3ae;text-align:center;margin-top:25px}
.cover-shell{min-height:100vh;background:radial-gradient(ellipse at top right,#e1f4f1 0,#f6f8fb 44%,#f6f8fb 100%);display:flex;align-items:center;justify-content:center;padding:35px}
.setup{width:min(960px,100%);display:grid;grid-template-columns:1fr 1.03fr;background:white;border-radius:25px;overflow:hidden;border:1px solid #dce7e9;box-shadow:0 25px 70px rgba(9,42,62,.11)}
.setup-aside{background:linear-gradient(160deg,#0c304a,#0a5260);color:white;padding:54px 46px;position:relative;overflow:hidden}
.setup-aside::after{content:"";position:absolute;width:400px;height:400px;border:1px solid rgba(255,255,255,.1);border-radius:50%;right:-240px;bottom:-200px;box-shadow:0 0 0 68px rgba(255,255,255,.035),0 0 0 150px rgba(255,255,255,.022)}
.setup-mark{display:inline-flex;align-items:center;gap:11px;font-size:15px;letter-spacing:-.3px;font-weight:790;margin-bottom:75px}
.setup-mark span{width:32px;height:32px;background:#1cd4bb;color:#0c3450;display:grid;place-items:center;border-radius:10px;font-weight:900}
.setup-aside h1{color:white;font-size:40px;line-height:1.15;letter-spacing:-1.9px;margin-bottom:19px}
.setup-aside p{color:#b7d4dc;font-size:14px;line-height:1.85}
.setup-steps{display:grid;gap:17px;margin-top:48px;color:#daeeee;font-size:12px}
.setup-steps span{display:flex;align-items:center;gap:11px}
.setup-steps b{background:#286378;color:#c9f8ec;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font-size:11px}
.setup-form{padding:52px 47px}
.setup-form h2{font-size:27px;font-weight:850;letter-spacing:-1px}
.setup-form .form-sub{font-size:13px;color:#778793;margin:5px 0 25px}
.rounds{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:21px}
.round-opt{border:1px solid #d9e3e9;background:#fff;border-radius:10px;padding:12px 8px;text-align:center;font-size:12px;font-weight:780;color:#506674}
.round-opt[aria-pressed="true"]{background:#e7f9f3;border-color:#0e8e79;color:#0b786b;box-shadow:0 0 0 1px #0e8e79 inset}
.setup-btn{width:100%;margin-top:7px;font-size:14px;padding:14px}
.setup-foot{font-size:11px;color:#86939c;text-align:center;margin-top:15px}
.success-circle{background:#e5f8f1;color:#17765c;border-radius:10px;padding:12px 14px;font-size:12px}
.mobile-toggle{display:none}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:30px 25px 60px}.topbar{padding:12px 25px}.sidebar{padding:25px 12px}.shell{grid-template-columns:218px 1fr}}
@media(max-width:790px){.shell{display:block}.sidebar{position:static;min-height:unset;max-height:none;padding:12px 16px}.brand{padding:0}.brand-sub,.nav-label,.sidebar-bottom{display:none}.nav-menu{display:flex;overflow-x:auto;margin-top:9px;gap:6px}.nav-item{width:auto;white-space:nowrap;padding:9px}.nav-icon{display:none}.topbar{min-height:60px;padding:10px 17px}.content{padding:25px 16px 60px}.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.page-head{align-items:start}.hero{padding:18px}.setup{grid-template-columns:1fr}.setup-aside{padding:29px 31px}.setup-aside h1{font-size:30px}.setup-aside .setup-steps{display:none}.setup-mark{margin-bottom:15px}.setup-form{padding:30px 29px}.setup-aside p{margin-bottom:0}}
@media(max-width:480px){.g4{grid-template-columns:1fr}.topbar{flex-wrap:wrap}.top-actions{width:100%}.top-actions .btn{flex:1}.page-head{display:block}.setup-form{padding:25px 20px}.setup-aside{padding:25px 20px}.content{padding:21px 13px}.card{padding:16px}.hero .icon-round{display:none}h1{font-size:24px}}

/* Guided navigation and accessible keyboard states */
.stage-nav{margin-top:26px;padding:19px 23px;background:linear-gradient(105deg,#e8f4f2,#f7fafb);border:1px solid #cfe6e2;border-radius:14px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.stage-label{display:block;letter-spacing:1.1px;color:#0b8177;font-size:10px;font-weight:800}
.stage-title{font-size:15px;font-weight:800;color:#123348;margin:3px 0 4px}
.nav-item:focus-visible,.btn:focus-visible,.round-opt:focus-visible,a:focus-visible{outline:3px solid #43d0bd;outline-offset:2px}
@media(max-width:790px){.nav-menu{scrollbar-width:thin;scrollbar-color:#46758a transparent}.stage-nav{flex-direction:column;align-items:stretch;padding:17px}}
@media(max-width:480px){.stage-nav .inline .btn{flex:1}.stage-nav .inline{display:flex;flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}

/* CAT Copilot — responsive, accessible side conversation */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.ai-top-button{border-color:#b3e5dc!important;background:#eef9f6!important;color:#117d70!important;font-weight:750!important}
.cat-chat-launcher{position:fixed;right:23px;bottom:24px;display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#0a746d,#063d58);color:#fff;border:0;border-radius:26px;padding:14px 19px;box-shadow:0 12px 32px rgba(0,45,55,.25);font-size:13px;font-weight:800;z-index:104;transition:transform .18s ease,box-shadow .18s ease}
.cat-chat-launcher:hover{transform:translateY(-2px);box-shadow:0 17px 32px rgba(0,45,55,.3)}
.cat-chat-launcher.is-open{background:#173b50}
.cat-chat-launcher:focus-visible,.cat-chat-panel button:focus-visible,.cat-chat-panel select:focus-visible,.cat-chat-panel textarea:focus-visible{outline:3px solid #6ee3cf;outline-offset:3px}
.cat-chat-panel{position:fixed;bottom:88px;right:23px;width:min(428px,calc(100vw - 32px));height:min(695px,calc(100dvh - 124px));background:white;border:1px solid #d6e3e7;border-radius:19px;box-shadow:0 26px 80px rgba(8,42,63,.25);z-index:103;display:flex;flex-direction:column;overflow:hidden;opacity:0;visibility:hidden;transform:translateY(14px) scale(.985);pointer-events:none;transition:opacity .22s ease,visibility .22s ease,transform .22s ease}
.cat-chat-panel.is-open{opacity:1;visibility:visible;transform:translateY(0) scale(1);pointer-events:auto}
.cat-chat-head{padding:16px 17px;display:flex;align-items:center;gap:11px;background:#10334d;color:#fff}
.cat-chat-head strong{font-size:14px;letter-spacing:-.2px}
.cat-chat-avatar{width:40px;height:40px;flex:none;display:grid;place-items:center;background:#17665e;border:1px solid #6fa7a2;border-radius:13px;color:#d5fff4;font-size:21px}
.cat-chat-status{font-size:10.5px;color:#b7d2dc;margin-top:2px;display:flex;align-items:center;gap:6px}
.cat-chat-dot{width:7px;height:7px;border-radius:50%;background:#e7b565}.cat-chat-dot.online{background:#59e2a5}
.cat-chat-top-actions{margin-left:auto;display:flex;gap:5px}.cat-chat-top-actions button{background:transparent;border:1px solid #41677a;color:#d3e9ec;border-radius:9px;width:31px;height:31px;font-size:19px}
.cat-chat-privacy{padding:10px 15px;background:#f4faf9;font-size:10.7px;line-height:1.5;color:#577078;border-bottom:1px solid #e1eeee}
.cat-chat-messages{flex:1;overflow:auto;min-height:0;padding:17px;background:linear-gradient(180deg,#fff,#fbfdfd)}
.cat-chat-welcome{text-align:center;color:#647884;padding:37px 16px 16px}
.cat-chat-welcome h3{margin:8px 0;color:#173c4d;font-size:18px}
.cat-chat-welcome p{max-width:290px;margin:auto;line-height:1.65;font-size:12px}
.cat-chat-hero{margin:auto;width:48px;height:48px;display:grid;place-items:center;border-radius:17px;background:#e4f8f2;color:#087b6b;font-size:25px}
.cat-chat-message{max-width:100%;margin:0 0 15px}.cat-chat-role{font-size:10px;font-weight:800;color:#6b8590;display:block;margin:0 0 5px}
.cat-chat-message.from-user{margin-left:28px}.cat-chat-message.from-user .cat-chat-role{text-align:right}.cat-chat-message.from-ai{margin-right:22px}
.cat-chat-bubble{font-size:12.5px;line-height:1.65;padding:12px 13px;border-radius:13px;white-space:pre-wrap;overflow-wrap:anywhere;background:#eff5f7;color:#1b3d4c;border:1px solid #e0ebef}
.from-user .cat-chat-bubble{background:#e4f8f3;border-color:#b5e3d8;color:#155b53}
.cat-chat-thinking{opacity:.65;font-style:italic}
.cat-chat-apply{margin-top:6px;padding:6px 11px;background:#e5f7ee;border:1px solid #afe0c9;border-radius:8px;color:#0c7363;font-size:11px;font-weight:780}
.cat-chat-prompt-row{display:flex;gap:6px;padding:9px 13px;overflow-x:auto;border-top:1px solid #e9edef;scrollbar-width:thin}
.cat-chat-prompt-row button{white-space:nowrap;font-size:10px;color:#2c6770;background:#f0f7f8;border:1px solid #d5e8eb;border-radius:20px;padding:6px 10px}
.cat-chat-compose{padding:11px 14px 14px;border-top:1px solid #e1eaef;background:#fff}
.cat-chat-compose label{font-size:10.5px;font-weight:750;color:#536d7a;display:block;margin:0 0 5px}
.cat-chat-compose select{font-size:11px;padding:8px 11px;margin-bottom:9px;max-width:100%;border:1px solid #d5e4e9;border-radius:9px}
.cat-chat-compose textarea{font-size:12px;min-height:68px;max-height:130px;resize:vertical;margin:0;border-color:#cfdee6;padding:10px 12px}
.cat-chat-send-row{display:flex;gap:7px;align-items:center;margin-top:9px}.cat-chat-send-row span{font-size:9.7px;color:#8196a0;flex:1;line-height:1.35}
.cat-chat-copy,.cat-chat-send{font-size:11px;font-weight:800;border:1px solid #c7dce1;padding:9px 11px;border-radius:9px;white-space:nowrap}
.cat-chat-copy{color:#315d6c;background:#f7fbfc}.cat-chat-send{background:#0a766f;border-color:#0a766f;color:white}
.cat-chat-send:disabled{opacity:.45;cursor:not-allowed}.cat-chat-error{font-size:11px;color:#a52c38;padding:5px 2px}
@media(max-width:620px){.cat-chat-panel{width:100vw;height:calc(100dvh - 65px);max-height:none;bottom:0;right:0;border-radius:16px 16px 0 0}.cat-chat-launcher{right:13px;bottom:12px;padding:10px 14px;z-index:104}.cat-chat-launcher.is-open{display:none}.cat-chat-head{padding:12px 14px}.cat-chat-messages{padding:12px}.cat-chat-compose{padding:8px 11px 12px}.cat-chat-prompt-row{padding:7px 9px}}
@media(prefers-reduced-motion:reduce){.cat-chat-launcher,.cat-chat-panel{transition:none!important}}

/* Auto-Research: research workflow and evidence cards */
.auto-top-button{border-color:#c1dce7!important;color:#0f536a!important;background:#edf7fa!important;font-weight:770!important}
.auto-home-cta{margin:0 0 21px;padding:25px 27px;background:linear-gradient(110deg,#10334c,#145c66 80%,#13786d);border-radius:16px;display:flex;align-items:center;justify-content:space-between;gap:20px;color:white;box-shadow:0 9px 24px #10334c16}

<body>
  <div id="app"></div>
  <div id="cat-assistant-root"></div>
  <input type="file" id="import-work" hidden accept=".json,application/json" />
  <input type="file" id="import-ris" hidden accept=".ris,.txt,.json" multiple />
  <script>
'use strict';
/* CAT Auto-Research UI: evidence-led discovery, provisional screening and confirmed draft application.
 * Loaded before app.js; functions execute after app.js has created the shared workspace state. */
function autoFresh(){return {status:'idle',phase:'',records:[],queries:[],filter:'all',errors:[],screened:false,screen_model:'',draft:null,draft_model:'',searched_at:'',last_transfer:0};}
function autoState(){if(!S.auto||typeof S.auto!=='object')S.auto=autoFresh();return S.auto;}
function safeExternalURL(value){try{const u=new URL(String(value||''));return /^https?:$/.test(u.protocol)?u.href:'';}catch{return '';}}
function autoTag(record){
 const st=record.screening?.status;
 const labels={possible:'Possible match',unclear:'Needs checking',unlikely:'Likely out of scope'};
 return st?`<span class="tag ${st==='possible'?'ok':st==='unlikely'?'pending':'info'}">${labels[st]}</span>`:'<span class="tag pending">Not screened</span>';
}
function autoCount(st){return autoState().records.filter(r=>r.screening?.status===st).length;}
function autoSelected(){return autoState().records.filter(r=>r.shortlisted);}
function autoRender(){
 const a=autoState(),d=S.model;
 const working=a.phase==='discovering'||a.phase==='screening'||a.phase==='drafting';
 const visible=a.records.filter(p=>a.filter==='all'||(a.filter==='shortlisted'&&p.shortlisted)||p.screening?.status===a.filter);
 const searched=a.queries.length>0;
 const queryRows=a.queries.map(q=>`<div class="auto-query-row"><span>${esc(q.query)}</span><strong>${q.error?'Unavailable':typeof q.count==='number'?q.count.toLocaleString()+' hits':'Not reported'}</strong>${q.error?`<small role="alert">${esc(q.error)}</small>`:''}</div>`).join('');
 const papers=visible.map(p=>{
  const link=safeExternalURL(p.url);
  return `<article class="auto-paper ${p.shortlisted?'is-selected':''}">
     <div class="auto-paper-main"><label class="auto-check"><input type="checkbox" data-auto-check="${esc(p.ref_id)}" ${p.shortlisted?'checked':''} aria-label="Shortlist ${esc(p.title)}"><span>Shortlist</span></label>
     <div class="auto-paper-body"><div class="auto-paper-heading"><span class="ref-chip">${esc(p.ref_id)}</span>${autoTag(p)}<span class="tag info">${esc(String(p.year||'Year unknown'))}</span></div>
     <h3>${esc(p.title||'Untitled')}</h3><div class="auto-source-line">${esc((p.authors||[]).slice(0,3).join(', ')||'Authors not provided')} · ${esc(p.journal||'Journal not confirmed')}</div>
     ${p.abstract?`<p class="auto-abstract">${esc(p.abstract.slice(0,650))}${p.abstract.length>650?'…':''}</p>`:'<p class="auto-abstract muted">Abstract unavailable: title-only appraisal would be unreliable.</p>'}
     ${p.screening?.reason?`<div class="auto-screening"><b>Preliminary screen:</b> ${esc(p.screening.reason)}${p.screening.design_hint?` · <i>Possible design: ${esc(p.screening.design_hint)}</i>`:''}</div>`:''}
     <div class="auto-paper-links">${p.doi?`<span>DOI: ${esc(p.doi)}</span>`:''}${link?`<a href="${esc(link)}" target="_blank" rel="noopener noreferrer">View source ↗</a>`:''}<span>${esc(p.source||'OpenAlex')} metadata · peer review unverified</span></div></div></div>
  </article>`;
 }).join('');
 const draft=a.draft?.fields;
 const draftPaths={decision_issue:'s1_1.decision_issue',application_context:'s1_1.application_context',selection_note:'s2_3.selection_note',conclusion:'s4_1.conclusion',key_findings:'s4_1.key_findings',boundary_conditions:'s4_1.boundary_conditions',conflicting_findings:'s4_1.conflicting_findings',weaknesses:'s4_3.weaknesses',credibility_reason:'s4_3.credibility_reason'};
 const draftLabels={decision_issue:'1.1 Decision issue',application_context:'1.1 Application context',selection_note:'2.3 Screening rationale',conclusion:'4.1 Conclusion',key_findings:'4.1 Key findings',boundary_conditions:'4.1 Boundary conditions',conflicting_findings:'4.1 Conflicting findings',weaknesses:'4.3 CAT weaknesses',credibility_reason:'4.3 Credibility rationale'};
 return `${head('AI research workspace','From question to evidence-backed draft','One guided pipeline: discover published records, screen abstracts provisionally, then prepare editable CAT text. Every source remains inspectable.')}
 <div class="auto-intro"><div class="auto-intro-left"><span class="kicker">RESEARCH WORKFLOW</span><h2>Research intelligently.<br><span>Verify confidently.</span></h2><p>Uses your existing <b>topic + CAT question</b>. No new form to complete. Academic findings are not assumed from search hits.</p><div class="auto-intro-actions"><button class="btn primary" data-action="auto-run" ${working?'disabled':''}>${a.phase==='discovering'?'Searching sources…':a.phase==='screening'?'AI screening…':'✦ Run Auto-Research'}</button><button class="btn" data-action="nav" data-section="question">Review PICOC ↗</button></div><small>Live discovery requires the local server and an internet connection. AI screening and drafting require a server-side OpenAI API key.</small></div>
  <div class="auto-steps"><div class="auto-step ${searched?'done':working?'active':''}"><span>01</span><div><strong>Discover</strong><small>Real bibliographic records + DOI</small></div><b>${searched?'✓':''}</b></div><div class="auto-step ${a.screened?'done':a.phase==='screening'?'active':''}"><span>02</span><div><strong>Screen</strong><small>AI preliminary relevance, not appraisal</small></div><b>${a.screened?'✓':''}</b></div><div class="auto-step ${draft?'done':a.phase==='drafting'?'active':''}"><span>03</span><div><strong>Draft & review</strong><small>Confirm each change to your CAT</small></div><b>${draft?'✓':''}</b></div></div></div>
 ${a.phase?`<div class="auto-live ${working?'is-loading':''}" role="status"><span>${working?'◌':'✓'}</span><div><strong>${esc(a.status)}</strong><small>${esc(a.phase==='discovering'?'Retrieving real metadata from OpenAlex.':a.phase==='screening'?'Checking abstracts with the optional AI service.':a.phase==='drafting'?'Preparing a provisional answer with cited source IDs.':'Your current research snapshot is saved locally.')}</small></div></div>`:''}
 ${a.errors.length?`<div class="auto-alert" role="alert">${a.errors.map(x=>`<p>${esc(x)}</p>`).join('')}</div>`:''}
 <div class="grid g4 auto-metrics"><div class="stat"><div class="lbl">Unique publications</div><div class="num">${a.records.length}</div><div class="detail">Metadata candidates</div></div><div class="stat"><div class="lbl">Possible relevance</div><div class="num">${autoCount('possible')}</div><div class="detail">Preliminary only</div></div><div class="stat"><div class="lbl">Need full review</div><div class="num">${autoCount('unclear')+a.records.filter(r=>!r.screening).length}</div><div class="detail">Not yet appraised</div></div><div class="stat"><div class="lbl">Shortlisted</div><div class="num">${autoSelected().length}</div><div class="detail">For editorial review</div></div></div>
 <div class="grid g2"><div class="card"><div class="card-head"><div><h2>Executed public discovery</h2><p class="card-sub">${a.searched_at?'Search date: '+esc(a.searched_at.slice(0,10)):'Searches are not yet executed.'}</p></div><span class="tag ${searched?'ok':'pending'}">${searched?'OpenAlex':'Not run'}</span></div>${searched?`<div class="auto-query-list">${queryRows}</div><p class="mini">Hit counts belong ONLY to these OpenAlex queries; they must not be recorded as ProQuest, Scopus, or ScienceDirect results. Returned records are capped and deduplicated.</p>`:'<div class="auto-empty-small">Start discovery to record exact source queries and the counts actually reported by OpenAlex.</div>'}<div class="inline auto-block-actions"><button class="btn sm" data-action="auto-record" ${!searched?'disabled':''}>Record OpenAlex steps in §2.2</button><button class="btn sm" data-action="auto-audit" ${!searched?'disabled':''}>↓ Research audit</button></div></div>
 <div class="card"><div class="card-head"><div><h2>Next actions</h2><p class="card-sub">Keep each step separate and accountable.</p></div></div><div class="auto-action-grid"><div><b>AI screen the publications</b><p>Rates title/abstract relevance, not causal effect or evidence quality.</p><button class="btn sm" data-action="auto-screen" ${!a.records.length||working?'disabled':''}>✦ Screen with AI</button></div><div><b>Create CAT prose draft</b><p>Uses only your shortlisted sources; never fabricates effect sizes or database hits.</p><button class="btn sm" data-action="auto-draft" ${!autoSelected().length||working?'disabled':''}>✦ Draft from selected sources</button></div><div><b>Transfer to appraisal</b><p>Add citation records as ungraded evidence; verify full texts before final use.</p><button class="btn sm" data-action="auto-transfer" ${!autoSelected().length||working?'disabled':''}>+ Add shortlisted to §2.3</button></div></div></div></div>
 <div class="card auto-library"><div class="card-head"><div><h2>Academic source library</h2><p class="card-sub">${visible.length} shown of ${a.records.length} publications. Tick only records worth full-text eligibility checks.</p></div><div class="auto-filters">${[['all','All'],['possible','Possible'],['unclear','Unclear'],['shortlisted','Shortlisted']].map(([v,l])=>`<button class="auto-filter ${a.filter===v?'is-on':''}" data-action="auto-filter" data-filter="${v}">${l}</button>`).join('')}</div></div>
 ${papers||`<div class="auto-empty"><span>⌕</span><strong>No sources to show</strong><p>${searched?'Try another filter, rerun discovery, or import RIS records in section II.':'Start Auto-Research to retrieve actual academic publication records.'}</p></div>`}</div>
 ${draft?`<div class="card auto-draft"><div class="card-head"><div><h2>Provisional AI CAT draft</h2><p class="card-sub">From ${a.draft.source_ids?.length||0} selected record(s). Always verify wording, eligibility, and original articles.</p></div><span class="tag pending">Not submission-ready</span></div><div class="auto-draft-note">Suggestions are shown before applying them. No study grades, numerical effects, or unexecuted database counts are filled in automatically.</div><div class="auto-draft-grid">${Object.entries(draft).filter(([k,v])=>draftPaths[k]&&v.length).map(([key,val])=>`<div class="auto-draft-field"><div class="row-between"><strong>${esc(draftLabels[key])}</strong><button class="btn sm" data-action="auto-apply" data-field="${esc(key)}">Apply to form ↗</button></div><ul>${val.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`).join('')}</div><button class="btn primary" data-action="auto-apply-all">Apply reviewed draft to form</button><p class="mini" style="margin-top:10px">Drafts are editable; applying requires confirmation and never assigns a study evidence level or effect size.</p></div>`:''}
 <div class="auto-footer-note"><strong>Transparency rule:</strong> OpenAlex provides discovery records; it does not authenticate access to subscribed databases, establish peer review, or substitute for original study appraisal. A completed CAT still requires source verification, correct research design, effect estimates, transparent search logs and a defensible synthesis.</div>`;
}
async function autoPost(endpoint,body){const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let j={};try{j=await res.json();}catch{}if(!res.ok)throw Error(j.error||`Research service returned HTTP ${res.status}.`);return j;}
async function autoAvailable(){try{const r=await fetch('/api/health');if(!r.ok)throw Error();const j=await r.json();return j.configured===true;}catch{return false;}}
function autoQueries(){const g=infer(S.model.meta.topic,S.model.s1_2.question);
 const text=(g.synI||[]).filter(Boolean),out=(g.synO||[]).filter(s=>!s.includes('screen separately'));
 return [...new Set([[text[0],out[0]],[text[1]||text[0],out[1]||out[0]],['systematic review',text[0],out[0]]].map(xs=>xs.filter(Boolean).join(' ')))];}
async function autoRun(){if(!S.model)return;const old=autoState();if(old.records.length&&!confirm('Run academic discovery again? The previous Auto-Research source list and AI draft will be replaced. Current CAT evidence and sections will remain unchanged.'))return;
 S.auto=autoFresh();const a=autoState();a.phase='discovering';a.status='Searching scholarly metadata';a.errors=[];persist();render();
 try{
  const result=await autoPost('/api/research',{topic:S.model.meta.topic,question:S.model.s1_2.question,queries:autoQueries()});
  a.queries=result.queries||[];a.records=(result.records||[]).map((p,i)=>({...p,ref_id:'R'+(i+1),shortlisted:false,screening:null}));a.searched_at=result.queried_at||new Date().toISOString();a.phase='ready';a.status=`Found ${a.records.length} distinct publication records`;
  for(const x of a.queries)if(x.error)a.errors.push(`Query “${x.query}” was incomplete: ${x.error}`);
  // Reuse established metadata library, with DOI/title deduplication; no grade assigned.
  const keys=new Set(S.library.map(p=>normalizeDoi(p.doi)||String(p.title||'').toLowerCase()));
  for(const p of a.records){const key=normalizeDoi(p.doi)||p.title.toLowerCase();if(!keys.has(key)){S.library.push(p);keys.add(key);}}
  persist();render();
  if(await autoAvailable() && a.records.length)await autoScreen(true);
 }catch(e){a.phase='error';a.status='Could not retrieve academic records';a.errors.push(e.message+' Start CAT Studio with the local Node server.');persist();render();}
}
async function autoScreen(silent=false){const a=autoState();if(!a.records.length)return;a.phase='screening';a.status='AI is reviewing titles and abstracts';persist();render();
 try{
  const chunkSize=12,chunks=[];for(let i=0;i<a.records.length;i+=chunkSize)chunks.push(a.records.slice(i,i+chunkSize));
  let count=0;
  for(let i=0;i<chunks.length;i++){
    a.status=`AI screening batch ${i+1} of ${chunks.length}`;persist();render();
    try{const result=await autoPost('/api/research/screen',{topic:S.model.meta.topic,question:S.model.s1_2.question,records:chunks[i].map(p=>({...p,id:p.ref_id}))});
      const byId=new Map((result.reviews||[]).map(r=>[r.id,r]));
      for(const p of chunks[i]){p.screening=byId.get(p.ref_id)||null;if(p.screening&&!a.screened)p.shortlisted=p.screening.status==='possible';}
      count+=byId.size;a.screen_model=result.model||'';
    }catch(e){a.errors.push(`Screening batch ${i+1} failed: ${e.message}`);}
    a.screened=count>0;persist();render();
  }
  a.phase='ready';a.status=`AI screened ${count} of ${a.records.length} candidate records; review decisions before inclusion`;
  if(count<a.records.length)a.errors.push(`${a.records.length-count} record(s) still require manual screening.`);
  persist();render();if(!silent)showToast('Preliminary screening completed. Review each paper before including it.');
 }catch(e){a.phase='ready';a.status='Source records available; AI screening unavailable';a.errors.push('AI screening: '+e.message);persist();render();}
}
async function autoDraft(){const a=autoState(),pick=autoSelected().slice(0,12);if(!pick.length){showToast('Shortlist at least one source first.');return;}
 a.phase='drafting';a.status='Generating provisional CAT sections';persist();render();
 try{const draft=await autoPost('/api/research/draft',{topic:S.model.meta.topic,question:S.model.s1_2.question,records:pick.map(p=>({...p,id:p.ref_id}))});
  a.draft=draft;a.draft_model=draft.model||'';a.phase='ready';a.status='Draft prepared for review; source verification is still required';persist();render();
 }catch(e){a.phase='ready';a.status='Draft not generated';a.errors.push('CAT draft: '+e.message);persist();render();}
}
function autoTransfer(){const a=autoState(),sel=autoSelected();if(!sel.length)return;

function validate(){const d=S.model,issues=[];if(!d)return[];

 if(d.s2_1.databases.filter(x=>x.name).length<3)issues.push('At least three databases should be documented.');
 if(d.s2_2.steps.filter(x=>x.code).length<5)issues.push('Document at least five search steps.');
 const codes=d.s2_2.steps.map(s=>s.code).join(' ').toLowerCase();if(!codes.includes('meta-analysis')||!codes.includes('systematic review'))issues.push('Search expressions should cover systematic reviews and meta-analyses.');
 if(!d.s2_2.steps.some(s=>Object.values(s.hits||{}).some(x=>typeof x==='number')))issues.push('No actual database hit counts recorded. Run and document the searches.');

CHAT_ROOT?.addEventListener('input',e=>{if(e.target.id==='cat-chat-text')CHAT.input=e.target.value;});
CHAT_ROOT?.addEventListener('change',e=>{if(e.target.id==='cat-chat-target')CHAT.target=chatAllowedTarget(e.target.value)?e.target.value:'';});
CHAT_ROOT?.addEventListener('keydown',e=>{if(e.target.id==='cat-chat-text'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();chatSend();}else if(e.key==='Escape'&&CHAT.open){toggleChat(false);}});
document.addEventListener('keydown',e=>{if(CHAT.open&&e.key==='Escape'&&e.target.id!=='cat-chat-text')toggleChat(false);});
render();

</script>
</body>
</html>
